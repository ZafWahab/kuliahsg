<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuliah Schedg SG</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Use Inter font as default */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Tailwind gray-50 */
        }
        /* Custom loading spinner */
        .loader {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #3b82f6; /* Blue */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-600">kuliah.sg</h1>
            <p class="text-lg text-gray-600 mt-2">Daily Kuliah Schedules From Mosques In Singapore.</p>
            <p class="text-sm text-gray-500 mt-1">
                Contact:
                <a href="mailto:zafwahab@gmail.com" class="text-blue-500 hover:text-blue-700 font-medium-transition-colors">
                    zafwahab@gmail.com
                </a>
            </p>
        </header>

        <!-- Search & Filter Input -->
        <div class="mb-6">
            <label for="search" class="sr-only">Search</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="ph ph-magnifying-glass text-gray-400"></i>
                </div>
                <input type="text" id="search"
                       class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Search by mosque, ustaz, or topic...">
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex justify-center items-center h-48">
            <div class="loader"></div>
        </div>

        <!-- Error Message State -->
        <div id="error" class="hidden text-center p-6 bg-red-100 text-red-700 rounded-lg rounded-lg">
            <p class="font-semibold">Could not load schedules.</p>
            <p>Please check the API connection or try again later.</p>
        </div>

        <!-- Kuliah List Container -->
        <div id="kuliah-list" class="space-y-4">
            <!-- Kuliah cards will be injected here by JavaScript -->
        </div>

        <!-- No Results State -->
        <div id="no-results" class="hidden text-center p-6 bg-gray-100 text-gray-600 rounded-lg">
            <i class="ph ph-x-circle text-4xl mb-2"></i>
            <p class="font-semibold">No results found.</p>
            <p>Try adjusting your search terms.</p>
        </div>

    </div>

    <!-- Kuliah Card Template (Used by JavaScript to quickly create new cards) -->
    <template id="kuliah-card-template">
        <div class="kuliah-card bg-white p-5 rounded-lg shadow-md border border-gray-200 transition-all transform hover:shadow-lg">
            <div class="flex flex-col md:flex-row justify-between md:items-center mb-3">
                <h2 class="card-title text-xl font-bold text-gray-800 mb-2 md:mb-0"></h2>
                <!-- NOTE: This now displays DAY and TIME -->
                <span class="card-date text-sm font-medium text-blue-600 bg-blue-100 px-3 py-1 rounded-full w-fit"></span>
            </div>
            
            <p class="card-mosque text-lg font-semibold text-gray-700 mb-2"></p>
            
            <div class="space-y-2 mb-4 text-gray-600">
                <div class="flex items-center">
                    <i class="ph ph-user-circle w-5 h-5 mr-2 text-blue-500"></i>
                    <span class="card-ustaz"></span>
                </div>
                <div class="flex items-center">
                    <i class="ph ph-book-open w-5 h-5 mr-2 text-blue-500"></i>
                    <span class="card-lang"></span>
                </div>
            </div>

            <!-- Livestream Button -->
            <a href="#" class="card-livestream-btn hidden inline-flex items-center px-4 py-2 bg-red-600 text-white font-semibold rounded-lg shadow-sm hover:bg-red-700 transition-colors">
                <i class="ph ph-youtube-logo w-5 h-5 mr-2"></i>
                Watch Live
            </a>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listElement = document.getElementById('kuliah-list');
            const searchInput = document.getElementById('search');
            const template = document.getElementById('kuliah-card-template');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');
            const noResultsElement = document.getElementById('no-results');

            // Set the API URL for Sheety
            const API_URL = 'https://api.sheety.co/955c852bb442e26a057a31756283fa95/kuliahsg/sheet1';
            
            let allKuliahs = []; 
            
            // Map to define the correct chronological order for days of the week
            const dayOrder = {
                'Monday': 1, 'Tuesday': 2, 'Wednesday': 3, 'Thursday': 4,
                'Friday': 5, 'Saturday': 6, 'Sunday': 7
            };

            // Function to fetch data from the API
            async function fetchKuliahs() {
                try {
                    // Show loading state
                    loadingElement.classList.remove('hidden');
                    errorElement.classList.add('hidden'); 
                    noResultsElement.classList.add('hidden');

                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    
                    // Sheety data is expected to be nested under 'sheet1'
                    const kuliahsData = data.sheet1; 

                    if (!Array.isArray(kuliahsData)) {
                         throw new Error("Data from API is not in the expected array format.");
                    }
                    
                    allKuliahs = kuliahsData; 
                    
                    // --- Custom Sorting Logic: Sort by Day, then by Time ---
                    allKuliahs.sort((a, b) => {
                        // 1. Sort by Day of the Week (using the predefined map)
                        // If the day is missing or invalid, treat it as the last in the order (99)
                        const dayA = dayOrder[a.day] || 99; 
                        const dayB = dayOrder[b.day] || 99;

                        if (dayA !== dayB) {
                            return dayA - dayB;
                        }

                        // 2. If days are the same, sort by Time string (e.g., "19:45:00" comes before "20:30:00")
                        if (a.time && b.time) {
                            return a.time.localeCompare(b.time);
                        }
                        
                        return 0; 
                    });


                    renderKuliahs(allKuliahs);
                    
                } catch (err) {
                    console.error('Error fetching data:', err);
                    errorElement.classList.remove('hidden');
                } finally {
                    loadingElement.classList.add('hidden');
                }
            }

            // Function to dynamically create and insert the schedule cards
            function renderKuliahs(kuliahs) {
                listElement.innerHTML = ''; // Clear previous list
                
                if (kuliahs.length === 0) {
                    noResultsElement.classList.remove('hidden');
                    return;
                }

                noResultsElement.classList.add('hidden');

                kuliahs.forEach(kuliah => {
                    const card = template.content.cloneNode(true);
                    
                    // --- Display Logic: Use Day and Time directly ---
                    const displayDay = kuliah.day || 'Day Not Specified';
                    const displayTime = kuliah.time || '';
                    
                    card.querySelector('.card-title').textContent = kuliah.topic;
                    // Combine Day and Time for the main badge display
                    card.querySelector('.card-date').textContent = `${displayDay} - ${displayTime}`;
                    card.querySelector('.card-mosque').textContent = kuliah.mosqueName;
                    card.querySelector('.card-ustaz').textContent = kuliah.ustaz;
                    card.querySelector('.card-lang').textContent = kuliah.language;

                    // Enable livestream button if URL exists
                    if (kuliah.livestreamURL) {
                        const btn = card.querySelector('.card-livestream-btn');
                        btn.href = kuliah.livestreamURL;
                        btn.target = '_blank';
                        btn.rel = 'noopener noreferrer';
                        btn.classList.remove('hidden');
                    }
                    
                    // Add all relevant text to data-search for filtering
                    const cardElement = card.querySelector('.kuliah-card');
                    cardElement.dataset.search = `${kuliah.topic} ${kuliah.mosqueName} ${kuliah.ustaz} ${kuliah.language} ${displayDay} ${displayTime}`.toLowerCase();

                    listElement.appendChild(card);
                });
            }

            // Filter function for real-time search
            function filterKuliahs() {
                const searchTerm = searchInput.value.toLowerCase();
                const allCards = listElement.querySelectorAll('.kuliah-card');
                let resultsFound = false;

                // Loop through all generated cards and show/hide based on search term
                allCards.forEach(card => {
                    if (card.dataset.search.includes(searchTerm)) {
                        card.classList.remove('hidden');
                        resultsFound = true;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                // Update "No results" message visibility
                if (!resultsFound) {
                    noResultsElement.classList.remove('hidden');
                } else {
                    noResultsElement.classList.add('hidden');
                }
            }

            // Event listener for the search box
            searchInput.addEventListener('input', filterKuliahs);

            // Fetch data when the page loads
            fetchKuliahs();
        });
    </script>
</body>

</html>
